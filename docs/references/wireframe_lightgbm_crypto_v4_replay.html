/* Qualité prédictive – nouvelle page */
.quality-toolbar{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:0 0 15px;padding:14px;background:#132238;border:1px solid var(--line);border-radius:var(--radius)}

.quality-matrix{display:grid;grid-template-columns:98px repeat(3,minmax(0,1fr));gap:6px}
.quality-matrix .m-title{padding:12px 7px;text-align:center;color:#a8b9ce;font-size:10px;font-weight:650;display:flex;align-items:center;justify-content:center}
.quality-matrix .m-rowlabel{font-size:10px;display:flex;align-items:center;color:#bfd0e1;font-weight:700;gap:6px}
.quality-matrix .m-cell{min-height:74px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;border-radius:7px;border:1px solid #ffffff0a;transition:filter .2s}
.quality-matrix .m-cell:hover{filter:brightness(1.22)}
.quality-matrix .m-cell strong{font-size:18px;letter-spacing:-.03em}
.quality-matrix .m-cell small{font-size:10px;color:#a2b8cd}
.quality-listrow{display:grid;grid-template-columns:87px 1fr 64px 64px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #23354a;font-size:11px}
.quality-listrow:last-child{border-bottom:0}
.quality-track{height:9px;border-radius:10px;background:#24374d;overflow:hidden}
.quality-fill{height:100%;border-radius:10px;background:var(--teal)}
.qlegend{display:flex;gap:13px;align-items:center;flex-wrap:wrap;font-size:10px;color:var(--muted);margin-top:8px}
.quality-score{font-size:26px;letter-spacing:-.035em;font-weight:800;line-height:1.2}
.quality-detail{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.quality-foot{padding:11px 12px;color:#c1cddd;background:#162b40;border:1px solid #2b4256;border-radius:7px;font-size:11px;line-height:1.7;margin-top:12px}
.quality-cellbtn{background:none;border:0;color:inherit;cursor:pointer;text-align:left;padding:0}
.quality-cellbtn:hover{text-decoration:underline;color:var(--teal)}
.qselect{border:1px solid #4b677b;color:#d0e6f9;background:#17344b;border-radius:5px;padding:3px 7px;font-size:10px}
.quality-interpret{display:grid;grid-template-columns: 22px 1fr;gap:11px;align-items:start}
.quality-interpret .num{background:#173f4a;color:#98fff1;border:1px solid #296675;border-radius:6px;height:22px;display:grid;place-items:center;font-size:11px;font-weight:800}

function panel(title,content,sub=''){return `<section class="panel"><div class="panel-h"><h2>${title}</h2>${sub?`<span class="micro">${sub}</span>`:''}</div>${content}</section>`}
function metric(title,value,delta='',klass=''){return `<div class="panel metric"><label>${title}</label><strong class="${klass}">${value}</strong><small>${delta}</small></div>`}
function tabbar(key,names){let a=state.tabs[key]||names[0];return `<div class="tabs">${names.map(n=>`<button class="${a===n?'active':''}" onclick="switchTab('${key}','${n}')">${n}</button>`).join('')}</div>`}
function lineChart(opts={}){let w=740,h=268,xp=34,yp=17,bottom=35;let xs=Array.from({length:75},(_,i)=>i);let path=(k,offset)=>xs.map((i)=>{let y=190 - i*k*.85 - 10*Math.sin(i/5) - 5*Math.cos(i/2.8)+offset + (k===0.1?12*Math.sin(i/8):0);return `${i?'L':'M'}${(xp+i*(w-xp-10)/74).toFixed(1)},${Math.max(30,Math.min(223,y)).toFixed(1)}`}).join(' ');return `<svg class="chart" viewBox="0 0 ${w} ${h}" aria-label="Courbe de capital fictive">${[40,90,140,190,225].map(y=>`<line class="svggrid" x1="${xp}" y1="${y}" x2="725" y2="${y}"/>`).join('')}${['Jan.','Mars','Mai','Juil.','Sept.','Nov.'].map((v,i)=>`<text class="chart-text" x="${xp+i*135}" y="260">${v}</text>`).join('')}<path d="${path(.1,17)}" stroke="#6888d6" opacity=".7" stroke-width="2" fill="none"/><path d="${path(.25,50)}" stroke="#f2b35b" opacity=".8" stroke-width="2" fill="none"/><path d="${path(.9,0)}" stroke="#27d2bb" stroke-width="3" fill="none"/></svg>`}
function barSVG(){const arr=[-.9,-.5,-.7,-.3,-.4,.2,.4,.75,1,.8,.4,.7,-.1,.3,.6,.8,.3,-.6];return `<svg class="chart" viewBox="0 0 510 178"><line class="svggrid" x1="25" x2="493" y1="86" y2="86"/>${arr.map((v,i)=>{let x=30+i*25,y=v>=0?86-57*v:86;return `<rect x="${x}" y="${y}" width="17" height="${Math.abs(v)*57}" rx="2" fill="${v>=0?'#27bda6':'#ec6977'}"/>`}).join('')}<text class="chart-text" x="25" y="165">Distribution des rendements de trades (%)</text></svg>`}
function probsChart(){let s=`<svg class="chart" viewBox="0 0 710 185">`;for(let i=0;i<5;i++){let y=17+i*33;s+=`<line class="svggrid" x1="34" y1="${y}" x2="700" y2="${y}"/>`;}let coords=Array.from({length:55},(_,i)=>[35+i*12,84+29*Math.sin(i*.25)+19*Math.cos(i*.77)]);s+=`<polyline points="${coords.map(([x,y])=>x+','+y).join(' ')}" stroke="#28c9b8" stroke-width="2.5" fill="none"/><line x1="34" y1="90" x2="700" y2="90" stroke="#f2b35b" stroke-dasharray="5 4"/><text x="45" y="179" class="chart-text">Evolution temporelle — probabilités estimées (fictives)</text></svg>`;return s}
function shap(){let x=[['Momentum M15',.72],['Volume relatif',.53],['RSI',-.31],['Volatilité',-.26],['Écart EMA48',.22],['Heure UTC',-.12]];return x.map(([name,v])=>`<div class="shap-row"><span>${name}</span><div class="bar-track"><div style="width:${Math.abs(v)*100}%;background:${v>0?'#2ec8ac':'#ee7585'}"></div></div><b class="${v>0?'positive':'negative'}">${v>0?'+':''}${v.toFixed(2)}</b></div>`).join('')}
function candleChart(){let w=970,h=360,left=45,bottom=36,N=48,top=18,plotH=260;let points=[];for(let i=0;i<N;i++){let mid=115-12*Math.sin(i*.27)-27*Math.sin(i*.09)+i*.40;let o=mid+8*Math.cos(i*1.33),c=mid+9*Math.sin(i*1.57);let low=Math.max(o,c)+5+(i%4),high=Math.min(o,c)-5-(i%5);points.push({o,c,low,high,x:left+i*(w-left-30)/N});}let t=TRADES.find(t=>t.id===state.trade)||TRADES[0];let c1=points[t.entryIndex],c2=points[t.exitIndex],replay=state.replay?state.replayPos:N;let s=`<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Graphique illustratif de bougies M5 et marqueurs de trades">`;
for(let i=0;i<6;i++){let y=top+i*plotH/5;s+=`<line class="svggrid" x1="${left}" x2="${w-23}" y1="${y}" y2="${y}"/><text class="chart-text" x="3" y="${y+3}">${(115100-i*255).toLocaleString('fr-FR')}</text>`}for(let i=0;i<N;i+=6){let x=points[i].x;s+=`<line class="svggrid" x1="${x}" x2="${x}" y1="${top}" y2="${top+plotH}"/><text class="chart-text" x="${x-4}" y="326">${(10+Math.floor(i/12)).toString().padStart(2,'0')}:${((i%12)*5).toString().padStart(2,'0')}</text>`}
points.slice(0,replay).forEach((p,i)=>{let color=p.c<p.o?'#27d2bb':'#ee6b7a';s+=`<line x1="${p.x}" x2="${p.x}" y1="${p.high}" y2="${p.low}" stroke="${color}" stroke-width="1.6"/><rect x="${p.x-4}" y="${Math.min(p.o,p.c)}" width="8" height="${Math.max(2,Math.abs(p.o-p.c))}" fill="${color}"/>`;if(state.showVolume){s+=`<rect x="${p.x-4}" y="${278+(i%3)*3}" width="8" height="${30-(i%3)*3}" fill="${color}" opacity=".40"/>`}});
if(state.showSl&&t.entryIndex<replay){s+=`<line x1="${c1.x}" x2="${Math.min(w-24,c2.x+14)}" y1="75" y2="75" stroke="#e08d54" stroke-dasharray="5 4"/><text x="${Math.min(w-145,c2.x+20)}" y="68" fill="#eeb36c" font-size="11">TP</text><line x1="${c1.x}" x2="${Math.min(w-24,c2.x+14)}" y1="202" y2="202" stroke="#e56c76" stroke-dasharray="5 4"/><text x="${Math.min(w-145,c2.x+20)}" y="196" fill="#e97b89" font-size="11">SL</text>`;}
if(state.showTrades){TRADES.forEach(tr=>{let p=points[tr.entryIndex];if(tr.entryIndex>=replay)return;s+=`<g class="trade-marker" onclick="chooseTrade(${tr.id})"><circle cx="${p.x}" cy="${p.low+17}" r="10" fill="${tr.id===state.trade?'#35d4bc':'#187a74'}" stroke="#c0fff7" stroke-width="${tr.id===state.trade?2.5:1}"/><text x="${p.x}" y="${p.low+20.5}" fill="#fff" text-anchor="middle" font-size="10" font-weight="700">A</text></g>`});let p=points[t.exitIndex];if(t.exitIndex<replay){s+=`<g class="trade-marker" onclick="chooseTrade(${t.id})"><circle cx="${p.x}" cy="${p.high-16}" r="10" fill="${t.pnl>0?'#4778d1':'#cc586b'}" stroke="#d7e7ff" stroke-width="1.5"/><text x="${p.x}" y="${p.high-12}" fill="white" text-anchor="middle" font-size="11" font-weight="700">S</text></g>`}}
s+=`<rect x="${left}" y="${top}" width="${w-left-23}" height="${plotH+36}" fill="none" stroke="#254256"/>`;if(state.replay){s+=`<text x="${w-185}" y="34" fill="#ffcd78" font-size="13">REPLAY • ${replay}/${N} bougies</text>`};return s+'</svg>'}
function tradeRows(){let trs=TRADES.filter(t=>state.filter==='Tous'||(state.filter==='Gagnants'?t.pnl>0:t.pnl<=0));return `<div class="tablewrap"><table><thead><tr><th>Trade</th><th>Entrée (UTC)</th><th>Sortie (UTC)</th><th>Position</th><th>Entrée</th><th>Sortie</th><th>Net</th><th>Prob.</th><th>Durée</th></tr></thead><tbody>${trs.map(t=>`<tr class="clickable ${t.id===state.trade?'selected':''}" onclick="chooseTrade(${t.id})"><td>#${t.id}</td><td>${t.date}</td><td>${t.exit}</td><td><span class="tag">${t.side}</span></td><td>${fmt(t.entry)}</td><td>${fmt(t.close)}</td><td class="${t.pnl>0?'positive':'negative'}">${t.pnl>0?'+':''}${t.pnl.toFixed(2)} %</td><td>${t.prob} %</td><td>${t.duration} min</td></tr>`).join('')}</tbody></table></div>`}
function screenOverview(){return head('Vue d’ensemble','Un aperçu rapide de la performance du modèle, de la qualité des probabilités et de la stabilité des stratégies.','<button class="btn primary" onclick="go(\'quality\')">◉ Voir la qualité prédictive →</button><button class="btn" onclick="go(\'trades\')">↗ Voir les trades</button>')+`<div class="grid g6">${metric('Rendement net','+18,3 %','Hypothèse de simulation','positive')}${metric('Sharpe','1,42','Annuel, illustratif')}${metric('Max drawdown','−12,6 %','Sur la période','negative')}${metric('Profit factor','1,87','Après coûts')}${metric('Nb de trades','1 523','M5, horizon 30 min')}${metric('AUC test','0,58','Hors échantillon')}</div><div class="space"></div><div class="grid maincols">${panel('Courbe de capital vs références',`<div class="legend"><span><i class="dot" style="background:#27d2bb"></i>Modèle net</span><span><i class="dot" style="background:#6888d6"></i>Buy & Hold</span><span><i class="dot" style="background:#f2b35b"></i>Stratégie naïve</span></div>${lineChart()}`,'Test hors échantillon')}${panel('Lecture rapide',`<div class="statusblock"><span class="positive">●</span><div><strong>Résultats à approfondir</strong><div class="tiny">Simulation fictive — aucune rentabilité vérifiée</div></div></div><div class="bullet"><b>Meilleur horizon de cette maquette : 30 min</b>À confirmer par validation et test final non exploité.</div><div class="bullet"><b>Risque : baisse en volatilité forte</b>Examiner la performance par régime avant toute décision.</div><div class="bullet"><b>Attention aux frais</b>Des frais plus élevés peuvent faire disparaître l’avantage.</div><button class="btn" onclick="go('interpret')">Ouvrir l’interprétation →</button>`)}</div><div class="space"></div><div class="grid g2">${panel('Comparaison des horizons',`<div class="tablewrap"><table><thead><tr><th>Horizon</th><th>Trades</th><th>Net</th><th>Sharpe</th><th>Max DD</th></tr></thead><tbody><tr><td>15 min</td><td>1 412</td><td class="positive">+8,4 %</td><td>0,84</td><td class="negative">−16,4 %</td></tr><tr><td><strong>30 min</strong></td><td>1 523</td><td class="positive">+18,3 %</td><td>1,42</td><td class="negative">−12,6 %</td></tr><tr><td>60 min</td><td>1 318</td><td class="positive">+9,7 %</td><td>0,93</td><td class="negative">−14,1 %</td></tr></tbody></table></div><div class="hint">Sélectionner l’horizon dans la barre supérieure modifie le contexte de la maquette, pas les données fictives.</div>`)}${panel('Qualité par régime de marché',`<div class="keylist">${[['Tendance haussière',.68],['Tendance baissière',.58],['Marché latéral',.54],['Volatilité élevée',.49]].map(([a,b])=>`<div class="keyrow"><span>${a}</span><div class="progress"><span style="width:${b*100}%"></span></div><b>${b.toFixed(2)}</b></div>`).join('')}</div><div class="hint">AUC par régime · scores fictifs, échantillons non affichés dans cette prévisualisation.</div>`)}</div>`}
function screenTrades(){let t=TRADES.find(t=>t.id===state.trade)||TRADES[0];return head('Graphique & trades','Visualiser les entrées, sorties, stop-loss, objectifs et interprétations sur les bougies. Maquette graphique inspirée du rendu attendu avec TradingView Lightweight Charts.',`<button class="btn ${state.replay?'primary':''}" onclick="state.replay=!state.replay;render()">${state.replay?'■ Quitter replay':'▶ Activer replay'}</button>`)+`<div class="grid maincols2"><div class="grid">${panel('Graphique BTC/USDT — M5',`<div class="controls"><button class="toggle ${state.showTrades?'active':''}" onclick="state.showTrades=!state.showTrades;render()">Entrées / sorties</button><button class="toggle ${state.showSl?'active':''}" onclick="state.showSl=!state.showSl;render()">TP / SL</button><button class="toggle ${state.showVolume?'active':''}" onclick="state.showVolume=!state.showVolume;render()">Volumes</button>${state.replay?`<button class="btn" onclick="state.replayPos=Math.max(2,state.replayPos-1);render()">◀ −1 bougie</button><button class="btn primary" onclick="state.replayPos=Math.min(48,state.replayPos+1);render()">+1 bougie ▶</button>`:''}</div><div class="trade-area">${candleChart()}</div><div class="legend"><span><i class="dot" style="background:#20c5ab"></i>A = achat / entrée</span><span><i class="dot" style="background:#6089e0"></i>S = sortie</span><span><i class="dot" style="background:#e56c76"></i>SL</span><span><i class="dot" style="background:#e0a96a"></i>TP</span></div><div class="hint">Clique sur un marqueur A ou S, ou sélectionne un trade dans le tableau. Le graphique est schématique : les prix du tableau sont indépendants du dessin des bougies.</div>`)}${panel('Journal des trades',`<div class="controls" style="margin-bottom:10px">${['Tous','Gagnants','Perdants'].map(x=>`<button class="toggle ${state.filter===x?'active':''}" onclick="state.filter='${x}';render()">${x}</button>`).join('')}</div>${tradeRows()}`,'Sélection synchronisée avec la fiche')}</div><div class="grid" style="align-content:start">${panel(`Trade sélectionné #${t.id}`,`<div class="statusblock"><span style="font-size:19px" class="${t.pnl>0?'positive':'negative'}">${t.pnl>0?'↗':'↘'}</span><div><strong class="${t.pnl>0?'positive':'negative'}">${t.pnl>0?'+':''}${t.pnl.toFixed(2)} % net</strong><div class="tiny">${t.duration} minutes · Long simulé</div></div></div><div class="split-attributes"><div class="attribute"><small>Entrée</small><strong>${fmt(t.entry)} USDT</strong></div><div class="attribute"><small>Sortie</small><strong>${fmt(t.close)} USDT</strong></div><div class="attribute"><small>Stop</small><strong>${fmt(t.stop)} USDT</strong></div><div class="attribute"><small>Objectif</small><strong>${fmt(t.take)} USDT</strong></div><div class="attribute"><small>Probabilité</small><strong>${t.prob} %</strong></div><div class="attribute"><small>Exécution</small><strong>Hypothétique</strong></div></div><div class="line"></div><div class="tiny">Raison principale (interprétation illustrative)</div><p style="font-size:12px">${t.reason}</p>`)}${panel('Pourquoi cette prédiction ?',`${shap()}<div class="hint">Les contributions SHAP présentées ici sont fictives. Elles n’expliquent pas nécessairement une causalité ni le résultat d’un trade.</div><button class="btn" onclick="go('interpret')">Analyse SHAP complète →</button>`)}${panel('Réalisme d’exécution',`<div class="mini-list"><div class="mini-item"><span>Frais aller-retour</span><b>0,15 %</b></div><div class="mini-item"><span>Slippage supposé</span><b>0,04 %</b></div><div class="mini-item"><span>Latence</span><b>À mesurer</b></div><div class="mini-item"><span>Ambiguïté TP / SL sur même M5</span><b class="warning">Convention prudente</b></div></div>`)}</div></div>`}
function screenSignals(){return head('Signaux','Dernières prédictions et décisions simulées : les probabilités ne sont ni des garanties ni une mesure directe de rentabilité.')+`<div class="grid g3">${panel('Dernier signal',`<div class="micro">Bougie clôturée à 13:35 UTC (fictif)</div><div class="kpi-main positive">64 %</div><div class="tiny">Probabilité de hausse à 30 min</div><div class="line"></div><div class="statusblock"><strong class="warning">● ATTENDRE</strong></div><p class="hint">Probabilité estimée inférieure au seuil validé de 67 % et avantage net insuffisant.</p>`)}${panel('Conditions de déclenchement',`<div class="mini-list"><div class="mini-item"><span>Probabilité calibrée</span><b>64 %</b></div><div class="mini-item"><span>Seuil de décision validé</span><b>67 %</b></div><div class="mini-item"><span>Régime</span><b>Volatilité élevée</b></div><div class="mini-item"><span>Coûts estimés</span><b>0,19 %</b></div><div class="mini-item"><span>Position ouverte</span><b>Non</b></div></div>`)}${panel('État du système',`<div class="mini-list"><div class="mini-item"><span>Mode</span><b class="blue">Démonstration</b></div><div class="mini-item"><span>Source de prix</span><b>Archive simulée</b></div><div class="mini-item"><span>Dernière mise à jour réelle</span><b class="warning">Aucune</b></div><div class="mini-item"><span>Version du modèle</span><b>v1.0</b></div><div class="mini-item"><span>Ordres automatiques</span><b>Non connectés</b></div></div>`)}</div><div class="space"></div><div class="grid maincols">${panel('Évolution des probabilités',`${probsChart()}<div class="legend"><span><i class="dot" style="background:#28c9b8"></i>Probabilité de hausse</span><span><i class="dot" style="background:#f2b35b"></i>Seuil de décision</span></div>`)}${panel('Motifs de rejet de signaux',`<div class="keylist">${[['Proba sous seuil',.68],['Volatilité excessive',.42],['Gain attendu insuffisant',.37],['Position déjà ouverte',.19]].map(([a,v])=>`<div class="keyrow"><span>${a}</span><div class="progress"><span style="width:${v*100}%"></span></div><b>${Math.round(v*100)}</b></div>`).join('')}</div><div class="hint">Fréquences fictives ; plusieurs causes possibles sur une même décision.</div>`)}</div><div class="space"></div>${panel('Historique des dernières prédictions',`<div class="tablewrap"><table><thead><tr><th>Heure UTC</th><th>Horizon</th><th>Probabilité</th><th>Décision</th><th>Régime</th><th>Information dominante</th></tr></thead><tbody>${[['13:35','30 min','64 %','Attendre','Volatilité haute','Volume + momentum'],['13:30','30 min','71 %','Long simulé','Tendance haussière','Momentum M15'],['13:25','30 min','55 %','Attendre','Range','ATR élevé'],['13:20','30 min','69 %','Long simulé','Tendance haussière','EMA48'],['13:15','30 min','62 %','Attendre','Range','Contexte H1']].map(r=>`<tr>${r.map((c,i)=>`<td>${i===3?`<span class="tag ${c==='Attendre'?'warn':''}">${c}</span>`:c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`)}<div class="space"></div><div class="notice">Ce prototype ne suit pas le marché en direct et ne passe aucun ordre. Les signaux sont des exemples de design.</div>`}
function screenBacktest(){let active=state.tabs.bt||'Capital';return head('Backtesting','Analyser les résultats nets après frais, les distributions de rendement, le risque et les références de marché.')+`${tabbar('bt',['Capital','Rendements','Drawdown','Trades','Coûts'])}<div class="grid g4">${metric('PnL net','+18,3 %','Sur la période fictive','positive')}${metric('Sharpe','1,42','Illustratif')}${metric('Max drawdown','−12,6 %','Pire baisse simulée','negative')}${metric('Trades','1 523','Frais intégrés')}</div><div class="space"></div><div class="grid maincols">${panel(active==='Capital'?'Capital net vs benchmarks':active==='Drawdown'?'Analyse du drawdown':active==='Coûts'?'Effet des frais':'Résultats du backtest',active==='Coûts'?`<div class="tablewrap"><table><thead><tr><th>Frais aller-retour</th><th>Net illustratif</th><th>Sharpe</th></tr></thead><tbody><tr><td>0,10 %</td><td class="positive">+27,5 %</td><td>1,81</td></tr><tr><td>0,20 %</td><td class="positive">+10,4 %</td><td>0,94</td></tr><tr><td>0,30 %</td><td class="negative">−5,6 %</td><td>−0,33</td></tr></tbody></table></div><p class="hint">Scénarios hypothétiques à remplacer par les coûts de marché mesurés.</p>`:lineChart()+`<div class="legend"><span><i class="dot" style="background:#27d2bb"></i>Stratégie</span><span><i class="dot" style="background:#6888d6"></i>Buy & Hold</span><span><i class="dot" style="background:#f2b35b"></i>Référence simple</span></div>`)}${panel('Métriques complémentaires',`<div class="mini-list">${[['Profit factor','1,87'],['Taux de trades gagnants','56,8 %'],['Gain moyen','+0,82 %'],['Perte moyenne','−0,71 %'],['Exposition moyenne','14 %'],['Durée moyenne','28 min'],['Frais simulés','0,15 % A/R'],['Slippage supposé','0,04 %']].map(([a,b])=>`<div class="mini-item"><span>${a}</span><b>${b}</b></div>`).join('')}</div>`)}</div><div class="space"></div><div class="grid g2">${panel('Distribution des rendements',barSVG())}${panel('Risque par horizon',`<div class="tablewrap"><table><thea // ─── Écran 11 : Qualité prédictive ───────────────────────────────────────────────
// Données volontairement synthétiques ; aucun entraînement réel n'a été exécuté.
const QCLASSES=['Hausse','Neutre','Baisse'];
const QCOLORS=['#34d8b9','#879db2','#f17c88'];
const QPAIR=[
  {id:'BTCUSDT',name:'BTCUSDT',kind:'Connue',offset:0.013},
  {id:'ETHUSDT',name:'ETHUSDT',kind:'Connue',offset:0.002},
  {id:'SOLUSDT',name:'SOLUSDT',kind:'Connue',offset:-0.019},
  {id:'AVAXUSDT',name:'AVAXUSDT',kind:'Connue',offset:0.006},
  {id:'LINKUSDT',name:'LINKUSDT',kind:'Inédite',offset:-0.030},
  {id:'DOGEUSDT',name:'DOGEUSDT',kind:'Inédite',offset:-0.046}
];
const QBASE={3:[0.548,0.565,0.551],6:[0.621,0.604,0.594],12:[0.566,0.574,0.557]};
const QSPLIT={test:{name:'Test final · paires connues',offset:0,size:1},wf:{name:'Validation walk-forward',offset:0.021,size:.70},unseen:{name:'Test final · paires inédites',offset:-.042,size:.48}};
function qFixed(n,p=1){return (100*n).toFixed(p).replace('.',',')+' %'}
function qPairAllowed(pair,split){return split==='unseen'?pair==='all'||QPAIR.some(p=>p.id===pair&&p.kind==='Inédite'):pair==='all'||QPAIR.some(p=>p.id===pair&&p.kind==='Connue')}
function qualitySet(key,value){
  qReplayStop(); state.qualityReplay.idx=2; state.qualityReplay.pos=QREPLAY_EVENTS[2].at;
  if(key==='h') state.quality.h=Number(value);
  else state.quality[key]=value;
  if(!qPairAllowed(state.quality.pair,state.quality.split))state.quality.pair='all';
  render();
}
function qPairOffset(pair,split){
  if(pair==='all')return split==='unseen' ? -.015 : 0;
  let p=QPAIR.find(p=>p.id===pair);return p?p.offset:0;
}
function qMatrix(h,split,pair){
  const q=QSPLIT[split],offset=q.offset+qPairOffset(pair,split),base=QBASE[h];
  let totals=pair==='all'?[980,1120,1000]:[360,430,390];
  totals=totals.map(v=>Math.round(v*q.size));
  return base.map((b,row)=>{
    const target=Math.max(.34,Math.min(.83,b+offset));
    const diag=Math.round(totals[row]*target),out=totals[row]-diag;
    const lead=Math.round(out*(row===1?.52:.55));
    let ret=[0,0,0];ret[row]=diag;
    const others=[0,1,2].filter(i=>i!==row);
    ret[others[0]]=lead;ret[others[1]]=out-lead;
    return ret;
  });
}
function qMetrics(mat){
  let n=mat.flat().reduce((a,b)=>a+b,0),r=mat.map(a=>a.reduce((x,y)=>x+y,0));
  let c=[0,1,2].map(j=>mat.reduce((a,arr)=>a+arr[j],0));
  let m=[0,1,2].map(i=>{let tp=mat[i][i],precision=tp/(c[i]||1),recall=tp/(r[i]||1),f1=2*precision*recall/(precision+recall||1);return {precision,recall,f1,support:r[i]}});
  return {n,correct:mat[0][0]+mat[1][1]+mat[2][2],balanced:m.reduce((a,b)=>a+b.recall,0)/3,macro:m.reduce((a,b)=>a+b.f1,0)/3,byClass:m};
}
function qSelect(label,key,options,value){return `<div class="field"><label>${label}</label><select aria-label="${label}" onchange="qualitySet('${key}',this.value)">${options.map(([id,name])=>`<option value="${id}" ${String(value)===String(id)?'selected':''}>${name}</option>`).join('')}</select></div>`}
function qMatrixHTML(matrix){
  let totals=matrix.map(row=>row.reduce((a,b)=>a+b,0));
  return `<div class="quality-matrix"><div class="m-title">RÉEL ↓ / PRÉDIT →</div>${QCLASSES.map((x,i)=>`<div class="m-title"><i class="dot" style="background:${QCOLORS[i]}"></i>${x}</div>`).join('')}${QCLASSES.map((real,i)=>`<div class="m-rowlabel"><i class="dot" style="background:${QCOLORS[i]}"></i>${real}</div>${matrix[i].map((count,j)=>{let p=count/totals[i],bg=i===j?`rgba(39,210,187,${Math.max(.12,.12+p*.45)})`:`rgba(244,126,141,${Math.max(.045,p*.27)})`;return `<div class="m-cell" style="background:${bg}" title="${count.toLocaleString('fr-FR')} observations : ${real} → ${QCLASSES[j]}"><strong>${qFixed(p,0)}</strong><small>${fmt(count)} cas</small></div>`}).join('')}`).join('')}</div>`;
}
function qHorizonChart(split,pair,selected){
 let rows=[3,6,12].map(h=>({h,v:qMetrics(qMatrix(h,split,pair)).balanced})),w=720,h=252;

 const classpanel=panel('Qualité par classe',`<div class="quality-listrow"><span class="tiny">CLASSE</span><span class="tiny">RECALL · rappel</span><span class="tiny">PRÉC.</span><span class="tiny">F1</span></div>${QCLASSES.map((c,i)=>`<div class="quality-listrow"><b style="color:${QCOLORS[i]}">${c}</b><div class="quality-track"><div class="quality-fill" style="width:${Math.round(f1[i].recall*100)}%;background:${QCOLORS[i]}"></div></div><b>${qFixed(f1[i].precision,0)}</b><b>${f1[i].f1.toFixed(2).replace('.',',')}</b></div>`).join('')}<div class="quality-foot"><strong>Comment lire ?</strong> Le rappel « Baisse » indique la part des vraies baisses reconnues. La précision « Baisse » indique la part des prédictions de baisse qui étaient correctes.</div>`);
 const meanCorrect=metrics.correct/metrics.n;
 const table=panel('Performance par cryptomonnaie',`<div class="tablewrap"><table><thead><tr><th>Paire</th><th>Statut</th><th>Balanced acc.</th><th>Comparaison</th><th>Obs.</th><th></th></tr></thead><tbody>${qPerPairRows(h,split)}</tbody></table></div><div class="hint">Clique sur une paire pour recalculer la vue. Les paires inédites sont entièrement exclues de l’entraînement fictif.</div>`);
 return head('Qualité prédictive','Comparer les directions prédites et les mouvements réellement observés en replay, puis mesurer la qualité du modèle hors échantillon.',`<button class="btn" onclick="go('interpret')">↗ Explications SHAP</button><button class="btn" onclick="go('trades')">↗ Graphique & trades</button>`)+
 topbar+
 qReplayUI()+
 `<div class="notice" style="margin-bottom:14px"><strong>Nouvel objectif : évaluer les prévisions, pas les gains.</strong> Toutes les mesures ci-dessous sont des exemples de design sans entraînement réel. Les séparations temporelles et les paires inédites seront calculées par le backend Python.</div>`+
 `<div class="grid g4">${metric('Balanced accuracy',qFixed(metrics.balanced),'Moyenne du rappel des 3 classes','positive')}${metric('Macro F1',metrics.macro.toFixed(3).replace('.',','),'Pondération égale des classes')}${metric('Log loss',logloss.toFixed(2).replace('.',','),'Valeur simulée · à minimiser')}${metric('Observations',fmt(metrics.n),'Prédictions fictives évaluées')}</div><div class="space"></div>`+
 `<div class="grid maincols2">${perf}${classpanel}</div><div class="space"></div>`+
 `<div class="grid maincols2">${panel('Comparaison des horizons',`${qHorizonChart(split,pair,h)}<div class="qlegend"><span><i class="dot" style="background:#28d0b8"></i>Horizon sélectionné</span><span><i class="dot" style="background:#607c9e"></i>Autres horizons</span><span><i class="dot" style="background:#f6bf64"></i>Baseline : classe majoritaire (33,3 % en balanced accuracy)</span></div><div class="hint">Clique sur une barre pour changer d’horizon. Benchmark illustratif, à recalculer réellement en conservant les mêmes échantillons.</div>`)}${panel('Calibration de la confiance',`${qCalibrationSVG(split,h,pair)}<div class="qlegend"><span><i class="dot" style="background:#8b9faf"></i>Calibration parfaite</span><span><i class="dot" style="background:#28d4bc"></i>Modèle (fictif)</span></div><div class="hint">La courbe compare la confiance maximale annoncée à la fréquence de prédictions correctes. Les intervalles et leurs effectifs devront être affichés avec de vraies données.</div>`)}</div><div class="space"></div>`+
 `<div class="grid maincols2">${table}${panel('Lecture des résultats',`<div class="quality-interpret"><div class="num">1</div><div><strong>Meilleur horizon de cette simulation : 30 min</strong><div class="tiny">Ce résultat est programmé pour illustrer la page. Il ne correspond pas à une découverte statistique.</div></div></div><div class="line"></div><div class="quality-interpret"><div class="num">2</div><div><strong>Vérifier surtout les baisses</strong><div class="tiny">Une bonne précision moyenne peut masquer des erreurs sur une classe. Utiliser précision, rappel et F1 par direction.</div></div></div><div class="line"></div><div class="quality-interpret"><div class="num">3</div><div><strong>Généralisation à des paires inédites</strong><div class="tiny">Le test sur des cryptos exclues doit être séparé de la sélection des features et hyperparamètres.</div></div></div><div class="line"></div><div class="quality-interpret"><div class="num">4</div><div><strong>Vérifier la chronologie</strong><div class="tiny">Ne jamais laisser un label franchir une frontière d’entraînement. Les données futures ne doivent pas être utilisées dans les features.</div></div></div>`,'Interprétation pédagogique')}</div><div class="space"></div>`+
 `${panel('Exemples de prédictions individuelles',`${qPredictionsTable(h,split,pair)}<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn" onclick="go('trades')">Voir le chart M5 →</button><button class="btn" onclick="go('walk')">Consulter le walk-forward →</button></div>`,'Comparaison prédit / réalisé · exemples uniquement')}`;
}

const SCREENS={overview:screenOverview,quality:screenQuality,trades:screenTrades,signals:screenSignals,backtest:screenBacktest,walk:screenWalk,train:screenTrain,interpret:screenInterpret,data:screenData,experiments:screenExperiments,settings:screenSettings};
function go(page){if(page!=='quality')qReplayStop();state.page=SCREENS[page]?page:'overview';history.replaceState(null,'','#'+state.page);render();window.scrollTo({top:0,behavior:'instant'})}
function switchTab(key,n){state.tabs[key]=n;render()}
function chooseTrade(id){state.trade=id;if(state.page!=='trades')state.page='trades';render()}
function render(){document.getElementById('nav').innerHTML=NAV.map(([id,ico,label])=>`<button class="${state.page===id?'active':''}" onclick="go('${id}')" title="${label}" aria-label="${label}"><span class="symbol">${ico}</span><span class="nav-label">${label}</span></button>`).join('');document.getElementById('root').innerHTML=SCREENS[state.page]()+`<div class="footer-note">CRYPTO ML WIREFRAME · PROTOTYPE DE NAVIGATION · TOUTES LES DONNÉES, COURBES ET SIGNAUX SONT FICTIFS · AUCUN TRADING RÉEL</div>`}
state.page=SCREENS[location.hash.slice(1)]?location.hash.slice(1):'quality';render();
</script>
