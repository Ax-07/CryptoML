[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptoml-backend"
version = "0.2.0"
description = "CryptoML P1 - futures ingestion + multi-crypto directional LightGBM"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pandas>=2.1,<3.0",
  "pyarrow>=15,<30",
  "httpx>=0.27,<1.0",
  "pydantic>=2.7,<3.0",
  "lightgbm>=4.3,<5.0",
  "scikit-learn>=1.4,<2.0",
  "joblib>=1.3,<2.0",
  "cryptography>=43,<48",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6,<1.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "ingestion*", "mlpipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
